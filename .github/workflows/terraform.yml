name: 'Provissioning of ECR+ECS Infrastructure'

on:
  push:
    branches: [ "main" ]
  pull_request:
      # branches: [ "main" ]

permissions:
  contents: read
  security-events: write
env:
  TF_VAR_mongo_uri: ${{ secrets.TF_VAR_mongo_uri}}
  TF_VAR_jwt_secret_key: ${{ secrets.TF_VAR_jwt_secret_key}}

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup GitLeak
      uses: gitleaks/gitleaks-action@v2
      




    - name: Run Checkov (Terraform Scan)
      uses: bridgecrewio/checkov-action@master
      with:
        directory: '.'
        framework: terraform
        soft_fail: true

    - name: Run Trivy (Filesystem Scan)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: 1
      

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
      

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform init

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform fmt -check

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform plan -input=false

      # On push to "main", build or change infrastructure according to Terraform configuration files
      # Note: It is recommended to set up a required "strict" status check in your repository for "Terraform Cloud". See the documentation on "strict" required status checks for more information: https://help.github.com/en/github/administering-a-repository/types-of-required-status-checks
    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        terraform apply -auto-approve -input=false
       
    - name: Export ALB URL
      run: |
       ALB=$(terraform output -raw alb_dns)
       echo "RAW_ALB=$ALB"

       if [ -z "$ALB" ]; then
        echo "ALB URL is empty!"
        exit 1
       fi

        echo "ALB_URL=http://$ALB" >> $GITHUB_ENV

    - name: Wait for ALB
      run: |
        for i in {1..15}; do
          if curl -s $ALB_URL > /dev/null; then
            echo "ALB is ready"
            exit 0
         fi
          echo "Waiting for ALB..."
          sleep 80
        done
        echo "ALB not reachable"
        exit 1

    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: ${{ env.ALB_URL }}
        # rules_file_name: 'zap/rules.txt'
        cmd_options: "--autooff"
        fail_action: true
        # docker_name: ghcr.io/zaproxy/zaproxy:stable




